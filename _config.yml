title: "Julior23"
description: "Estudiante de ASIR · Redes, Linux, Docker & Ciberseguridad"
author: "Julio A. Romero Ramírez"
email: "contacto@julior23.es"
url: "https://julior23.es"
baseurl: ""

lang: es

github_username: Juli0r23
linkedin_username: julior23

og_image: "/assets/img/og-preview.png"

# Excluir de la build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Highlight de sintaxis
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false

# Datos del CV
cv:
  disponible: true
  ubicacion: "Extremadura, España"
  curso: "ASIR · 2º Año"

# Collection para las entradas de blog en inglés (en/_posts/)
collections:
  en_posts:
    output: true
    permalink: /en/:year/:month/:day/:title/
