---
layout: default
title: 404 — Página no encontrada
permalink: /404.html
---

<main class="page-wrap" style="max-width:700px;text-align:center">

<div class="section-label" style="text-align:left">// error</div>
<h1 style="font-size:2rem;font-weight:600;color:#e6edf3;margin-bottom:2rem">404</h1>

<div class="terminal" style="margin-bottom:2.5rem;text-align:left">
  <div class="terminal-bar">
    <div class="dot-r"></div><div class="dot-y"></div><div class="dot-g"></div>
    <span class="terminal-title">bash — julio@server:~</span>
  </div>
  <div class="terminal-body" id="typed-terminal-404">
    <!-- Contenido inyectado por JS -->
  </div>
</div>

<div class="hero-btns" style="justify-content:center">
  <a href="{{ '/' | relative_url }}" class="btn btn-primary">← volver al inicio</a>
  <a href="{{ '/blog/' | relative_url }}" class="btn btn-ghost">ir al blog →</a>
</div>

</main>

<script>
(function() {
  var path = window.location.pathname;

  var lines = [
    { type: 'cmd',  text: 'cd ' + path },
    { type: 'err',  text: 'bash: cd: ' + path + ': No such file or directory' },
    { type: 'cmd',  text: 'find / -name "' + path.split('/').filter(Boolean).pop() + '"' },
    { type: 'err',  text: 'find: nothing found' },
    { type: 'cmd',  text: 'ping -c 1 esta-pagina.local' },
    { type: 'err',  text: 'ping: esta-pagina.local: Name or service not known' },
    { type: 'cmd',  text: 'echo $SUGGESTION' },
    { type: 'ok',   text: 'quizás buscabas /blog/ o /cv/' },
    { type: 'cursor', text: '' }
  ];

  var container = document.getElementById('typed-terminal-404');
  if (!container) return;

  function makeLine(type, text) {
    var div = document.createElement('div');
    if (type === 'cmd')    { div.className = 't-cmd';  div.textContent = text; }
    else if (type === 'ok')  { div.className = 't-ok';   div.textContent = text; }
    else if (type === 'out') { div.className = 't-out';  div.textContent = text; }
    else if (type === 'err') {
      div.className = 't-warn';
      div.style.color = '#ff6b6b';
      div.textContent = text;
    } else if (type === 'cursor') {
      div.className = 't-cmd';
      div.innerHTML = '<span style="color:var(--muted)">█</span>';
    }
    return div;
  }

  function typeText(el, text, cb) {
    var i = 0;
    el.textContent = '';
    function tick() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(tick, 45 + Math.random() * 30);
      } else {
        if (cb) setTimeout(cb, 180);
      }
    }
    tick();
  }

  function renderLines(index) {
    if (index >= lines.length) return;
    var line = lines[index];

    if (line.type === 'cmd' && index > 0) {
      var spacer = document.createElement('div');
      spacer.style.height = '.4rem';
      container.appendChild(spacer);
    }

    var el = makeLine(line.type, '');
    container.appendChild(el);

    if (line.type === 'cmd') {
      typeText(el, line.text, function() { renderLines(index + 1); });
    } else if (line.type === 'cursor') {
      renderLines(index + 1);
    } else {
      setTimeout(function() {
        el.textContent = line.text;
        if (line.type === 'err') el.style.color = '#ff6b6b';
        renderLines(index + 1);
      }, 120);
    }
  }

  setTimeout(function() { renderLines(0); }, 600);
})();
</script>
