<nav class="site-nav">
  <a href="{{ '/' | relative_url }}" class="nav-logo">
    <span class="prompt">~/</span>{{ site.github_username }}<span class="nav-cursor"></span>
  </a>

  <!-- Menú escritorio -->
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>inicio</a></li>
    <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>blog</a></li>
    <li><a href="{{ '/proyectos/' | relative_url }}"{% if page.url contains '/proyectos' %} class="active"{% endif %}>proyectos</a></li>
    <li><a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} class="active"{% endif %}>cv</a></li>
    <li><a href="{{ '/contacto/' | relative_url }}"{% if page.url contains '/contacto' %} class="active"{% endif %}>contacto</a></li>
  </ul>

  <!-- Botón hamburguesa (solo móvil) -->
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<!-- Menú móvil desplegable -->
<div class="nav-mobile" id="nav-mobile">
  <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>inicio</a>
  <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>blog</a>
  <a href="{{ '/proyectos/' | relative_url }}"{% if page.url contains '/proyectos' %} class="active"{% endif %}>proyectos</a>
  <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} class="active"{% endif %}>cv</a>
  <a href="{{ '/contacto/' | relative_url }}"{% if page.url contains '/contacto' %} class="active"{% endif %}>contacto</a>
</div>

<script>
  const btn = document.getElementById('nav-hamburger');
  const menu = document.getElementById('nav-mobile');
  btn.addEventListener('click', () => {
    btn.classList.toggle('open');
    menu.classList.toggle('open');
  });
  // Cerrar al hacer clic en un enlace
  menu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      btn.classList.remove('open');
      menu.classList.remove('open');
    });
  });
</script>
