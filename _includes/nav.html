  </a>

  <!-- Menú escritorio -->
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %} title="$ cd ~/">/inicio</a></li>

    <li><a href="{{ '/contacto/' | relative_url }}"{% if page.url contains '/contacto' %} class="active" aria-current="page"{% endif %} title="$ ping contacto">/contacto</a></li>
    <li>
      <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
        <div class="theme-toggle-thumb" id="theme-thumb">
          <span id="theme-icon">🌙</span>
        </div>
      </button>
    </li>
  </ul>

  <!-- Botón hamburguesa (solo móvil) -->

  </button>
