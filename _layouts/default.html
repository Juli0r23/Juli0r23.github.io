<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <!-- BOTÓN VOLVER ARRIBA -->
  <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">
    <span>↑</span>
  </button>

  <script>
  (function() {
    const btn = document.getElementById('back-to-top');
    if (!btn) return;

    window.addEventListener('scroll', function() {
      btn.classList.toggle('btt-visible', window.scrollY > 300);
    }, { passive: true });

    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
  </script>

  <style>
  .back-to-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(13,24,36,0.8);
    border: 1px solid var(--glass-border);
    color: var(--green);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 90;
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s, border-color 0.2s, box-shadow 0.2s;
  }
  .back-to-top:hover {
    border-color: var(--green);
    box-shadow: 0 0 16px rgba(0,255,136,0.2);
  }
  .btt-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  </style>

</body>
</html>
