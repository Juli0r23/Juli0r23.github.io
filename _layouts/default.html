<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Zoom adaptativo: se ejecuta antes de pintar para evitar flash -->
  <script>
  (function(){var R=1440,M=768,t=null;function z(){var w=window.innerWidth;document.documentElement.style.zoom=w<=M?'':(w>R?(w/R)*0.9:'');}z();window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(z,100);});window.__zoomInit=true;}());
  </script>

  <!-- Conexión anticipada a Google Fonts (ahorra una ronda DNS+TLS completa) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:image" content="{{ page.og_image | default: '/assets/img/og-preview.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/assets/img/og-preview.png' | absolute_url }}">

  <!-- Google Fonts: carga no bloqueante (media="print" + onload) para no retrasar el primer pintado -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap"></noscript>

  <!-- Favicons y Estilos -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/android-chrome-192x192.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/android-chrome-512x512.png' | relative_url }}">

  <!-- hreflang: relación ES/EN entre páginas traducidas -->
  {% if page.lang == 'en' %}
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.lang_es_url | default: '/' | relative_url }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url | relative_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.lang_es_url | default: '/' | relative_url }}">
  {% elsif page.lang_en_url %}
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.url | relative_url }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.lang_en_url | relative_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url | relative_url }}">
  {% endif %}

  {% seo %}
  {% feed_meta %}

  <!-- Datos estructurados: Person (solo en la portada) -->
  {% if page.url == '/' or page.url == '/en/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "email": "mailto:{{ site.email }}",
    "jobTitle": "{{ site.cv.curso }}",
    "sameAs": [
      "https://github.com/{{ site.github_username }}",
      "https://linkedin.com/in/{{ site.linkedin_username }}"
    ]
  }
  </script>
  {% endif %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <!-- Overlay de transición -->
  <div class="page-transition" id="page-transition"></div>

  <!-- Botón volver arriba -->
  <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">
    <span>↑</span>
  </button>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>
</html>
