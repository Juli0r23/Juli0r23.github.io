<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Zoom adaptativo: se ejecuta antes de pintar para evitar flash -->
  <script>
  (function(){var R=1440,M=768,t=null;function z(){var w=window.innerWidth;document.documentElement.style.zoom=w<=M?'':(w>R?(w/R)*0.9:'');}z();window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(z,100);});}());
  </script>

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/android-chrome-192x192.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/android-chrome-512x512.png' | relative_url }}">

  <!-- hreflang: relación ES/EN entre páginas traducidas -->
  {% if page.lang == 'en' %}
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.lang_es_url | default: '/' | relative_url }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url | relative_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.lang_es_url | default: '/' | relative_url }}">
  {% elsif page.lang_en_url %}
  <link rel="alternate" hreflang="es" href="{{ site.url }}{{ page.url | relative_url }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.lang_en_url | relative_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url | relative_url }}">
  {% endif %}

  {% seo %}
  {% feed_meta %}

  <!-- Datos estructurados: Person (solo en la portada) -->
  {% if page.url == '/' or page.url == '/en/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "email": "mailto:{{ site.email }}",
    "jobTitle": "{{ site.cv.curso }}",
    "sameAs": [
      "https://github.com/{{ site.github_username }}",
      "https://linkedin.com/in/{{ site.linkedin_username }}"
    ]
  }
  </script>
  {% endif %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <!-- Overlay de transición -->
  <div class="page-transition" id="page-transition"></div>

  <!-- Botón volver arriba -->
  <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">
    <span>↑</span>
  </button>

  <style>
  .back-to-top {
    position: fixed; bottom: 2rem; right: 2rem;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(13,24,36,0.8);
    border: 1px solid var(--glass-border);
    color: var(--green); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 90; opacity: 0; transform: translateY(12px);
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s, border-color 0.2s, box-shadow 0.2s;
  }
  .back-to-top:hover { border-color: var(--green); box-shadow: 0 0 16px rgba(0,255,136,0.2); }
  .btt-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  </style>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>
</html>
